<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>%TITLE%</title>
  <meta name="description" content="%DESCRIPTION%">
  <meta name="theme-color" content="#2f3a8f">
  <!-- Link previews (WhatsApp, Slack, iMessage…). The server fills in the absolute URLs. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Monopoly">
  <meta property="og:title" content="%TITLE%">
  <meta property="og:description" content="%DESCRIPTION%">
  <meta property="og:url" content="%URL%">
  <meta property="og:image" content="%ORIGIN%/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Monopoly: buy, build and trade around the world">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/baloo2.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/ui.css">
  <link rel="stylesheet" href="/css/board.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('rr:theme') || 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <!-- Shared game data (UMD → window.RR), then the socket client, then the app. -->
  <script src="/shared/board.js"></script>
  <script src="/shared/cards.js"></script>
  <script src="/shared/rules.js"></script>
  <script src="/socket.io/socket.io.min.js"></script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="/" aria-label="Monopoly home">
      <span class="brand-coin" aria-hidden="true">₹</span>
      <span class="brand-name">Monopoly</span>
    </a>
    <div class="topbar-right">
      <span id="topbar-room" class="room-chip" hidden></span>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to light theme" title="Switch to light theme">
        <span aria-hidden="true">☀️</span>
      </button>
      <button id="notif-toggle" class="icon-btn" type="button" aria-label="Notifications: All" title="Notifications: All">
        <span aria-hidden="true">🔔</span>
      </button>
      <button id="sound-toggle" class="icon-btn" type="button" aria-pressed="false" aria-label="Sound off">
        <span aria-hidden="true">🔇</span>
      </button>
      <button id="help-btn" class="icon-btn" type="button" aria-label="How to play" title="How to play"><span aria-hidden="true">?</span></button>
      <span id="conn" class="pill pill-connecting" role="status">Connecting…</span>
      <button id="leave-btn" class="btn btn-ghost btn-sm" type="button" hidden>Leave</button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- HOME -->
    <section id="screen-home" class="screen screen-home" aria-labelledby="home-title" hidden>
      <div class="hero">
        <div class="logo" aria-hidden="true"><span>₹</span></div>
        <h1 id="home-title" class="title">Monopoly</h1>
        <p class="tagline">Buy, build, bid and trade your way around the world.</p>
      </div>
      <div class="home-grid">
        <div class="card home-card">
          <label class="field-label" for="home-name">Your name</label>
          <input id="home-name" class="input" maxlength="16" autocomplete="nickname" placeholder="e.g. Asha">
          <button id="home-create" class="btn btn-primary btn-lg btn-block" type="button">Create a room</button>
          <div class="divider"><span>or join with a code</span></div>
          <form id="home-join" class="join-row">
            <input id="home-code" class="input input-code" maxlength="6" placeholder="ABC123"
                   aria-label="Room code" autocapitalize="characters" autocomplete="off" spellcheck="false">
            <button id="home-join-btn" class="btn btn-secondary" type="submit">Join</button>
          </form>
          <p id="home-hint" class="hint" aria-live="polite"></p>
          <button id="home-help" class="link-btn home-help" type="button">New here? How to play</button>
        </div>
        <div class="card">
          <h2 class="card-title">Open rooms</h2>
          <ul id="home-rooms" class="room-list" aria-live="polite"></ul>
        </div>
      </div>
    </section>

    <!-- LOBBY -->
    <section id="screen-lobby" class="screen screen-lobby" aria-labelledby="lobby-title" hidden>
      <div class="card lobby-head">
        <h1 id="lobby-title" class="eyebrow">Room code</h1>
        <p id="lobby-code" class="room-code"></p>
        <div class="lobby-share">
          <button id="lobby-copy" class="btn btn-secondary" type="button">Copy invite link</button>
          <span id="lobby-link" class="muted break"></span>
        </div>
      </div>
      <div class="lobby-grid">
        <div class="card">
          <h2 class="card-title">Players <span id="lobby-count" class="muted"></span></h2>
          <ul id="lobby-players" class="player-list"></ul>
          <h3 class="card-subtitle" id="colour-label">Your colour</h3>
          <div id="lobby-colours" class="colour-grid" role="radiogroup" aria-labelledby="colour-label"></div>
          <div class="lobby-start">
            <button id="lobby-start" class="btn btn-primary btn-lg btn-block" type="button">Start game</button>
            <p id="lobby-start-hint" class="hint"></p>
          </div>
        </div>
        <div class="card">
          <h2 class="card-title">Settings <span id="lobby-settings-note" class="muted"></span></h2>
          <form id="lobby-settings" class="settings"></form>
        </div>
        <div class="card chat-card">
          <h2 class="card-title">Chat</h2>
          <div id="lobby-chat" class="chat-host"></div>
        </div>
      </div>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen screen-game" aria-label="Game" hidden>
      <div class="game-layout">
        <div class="board-area">
          <div id="game-banners" class="banners"></div>
          <div class="board-fit">
            <div id="board" class="board" role="group" aria-label="Game board">
              <div class="board-center">
                <div class="center-glow" aria-hidden="true"></div>
                <div class="center-inner">
                  <p class="center-brand" aria-hidden="true">Monopoly</p>
                  <div id="dice" class="dice" aria-label="Dice"></div>
                  <div id="timer" class="timer" hidden>
                    <div class="timer-track"><div class="timer-bar"></div></div>
                    <span class="timer-text"></span>
                  </div>
                  <div id="jackpot" class="jackpot" hidden></div>
                  <div id="center-auction" class="auction-host desktop-only"></div>
                  <div id="center-actions" class="actions desktop-only"></div>
                  <div id="center-log" class="log desktop-only"></div>
                </div>
              </div>
              <div id="token-layer" class="token-layer" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <aside class="sidebar" aria-label="Game panels">
          <div class="tabs" role="tablist" aria-label="Panels">
            <button class="tab mobile-only" role="tab" type="button" data-tab="actions" id="tab-actions" aria-controls="panel-actions">Actions</button>
            <button class="tab" role="tab" type="button" data-tab="players" id="tab-players" aria-controls="panel-players">Players</button>
            <button class="tab" role="tab" type="button" data-tab="cities" id="tab-cities" aria-controls="panel-cities">Cities</button>
            <button class="tab" role="tab" type="button" data-tab="trades" id="tab-trades" aria-controls="panel-trades">Trades <span class="tab-badge" id="trade-badge" hidden></span></button>
            <button class="tab" role="tab" type="button" data-tab="chat" id="tab-chat" aria-controls="panel-chat">Chat <span class="tab-badge" id="chat-badge" hidden></span></button>
          </div>
          <div class="tab-panels">
            <div class="panel mobile-only" id="panel-actions" role="tabpanel" aria-labelledby="tab-actions">
              <div id="mobile-auction" class="auction-host"></div>
              <div id="mobile-actions" class="actions"></div>
              <h3 class="panel-title">Game log</h3>
              <div id="mobile-log" class="log"></div>
            </div>
            <div class="panel" id="panel-players" role="tabpanel" aria-labelledby="tab-players"></div>
            <div class="panel" id="panel-cities" role="tabpanel" aria-labelledby="tab-cities"></div>
            <div class="panel" id="panel-trades" role="tabpanel" aria-labelledby="tab-trades"></div>
            <div class="panel" id="panel-chat" role="tabpanel" aria-labelledby="tab-chat">
              <div id="game-chat" class="chat-host"></div>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
