# Render blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rupee-rush
    runtime: node
    plan: free
    # Production dependencies only: Playwright and socket.io-client are dev-only.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
